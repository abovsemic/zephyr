description: |
  ABOV32 Watch Dog Timer, driven via the ABOV HLL WDT API (hll_wdt.h). Runs
  from the internal 32 kHz LSI oscillator routed through the MCCR clock mux.
  Count-match (window) mode is not implemented on the IP version used by
  this SoC series -- only a single free-running down-counter with an
  optional reset-on-underflow and an optional underflow interrupt.

compatible: "abov,abov32-wdt"

include: base.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true

  wdt-id:
    type: int
    required: true
    description: |
      HAL WDT_ID_e instance index (0 = WDT0).
